name: Release
# Manual: Actions → Release → Run workflow. Bumps the version, updates
# CHANGELOG.md from commit messages (feat:/fix:/other), tags, and publishes a
# GitHub release with the extension zip attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch, minor, major, or an explicit x.y.z'
        required: true
        default: patch
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/release.js "${{ inputs.version }}"
      - name: Commit and tag
        run: |
          v=$(node -p "require('./manifest.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): v$v"
          git tag "v$v"
          git push origin HEAD "v$v"
      - run: npm run package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./manifest.json').version")
          gh release create "v$v" ./*.zip --title "v$v" --notes-file release-notes.md
